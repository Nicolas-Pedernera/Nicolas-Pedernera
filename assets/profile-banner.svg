<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nicolás Pedernera</title>
  <desc id="desc">Backend, sistemas en tiempo real e ingeniería blockchain. Fundador y CEO de ZendX.</desc>
  <rect width="1200" height="280" fill="#0a0e17"/>
  <g stroke="#1c2a3f" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
  </g>
  <!-- node/network motif representing backend + blockchain + realtime -->
  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <circle cx="120" cy="90" r="14"/>
    <circle cx="120" cy="190" r="14"/>
    <circle cx="200" cy="140" r="14" stroke="#a855f7"/>
    <circle cx="60" cy="140" r="14" stroke="#22c55e"/>
  </g>
  <g stroke="#334155" stroke-width="1.5">
    <line x1="120" y1="104" x2="200" y2="140"/>
    <line x1="120" y1="176" x2="200" y2="140"/>
    <line x1="120" y1="104" x2="60" y2="140"/>
    <line x1="120" y1="176" x2="60" y2="140"/>
    <line x1="60" y1="140" x2="200" y2="140"/>
  </g>
  <text x="260" y="120" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">Nicolás Pedernera</text>
  <text x="260" y="155" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Backend · Real-time systems · Blockchain engineering</text>
  <text x="260" y="182" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">Founder &amp; CEO @ ZendX — zendx.finance</text>
</svg>
